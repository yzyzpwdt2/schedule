<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#08111f">

  <link rel="manifest" href="manifest.webmanifest">

  <title>北市勤務排程</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #08111f;
      color: #fff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;
    }

    .app {
      max-width: 560px;
      margin: auto;
      padding: 18px 10px;
      padding-top: max(18px, env(safe-area-inset-top));
    }

    .top {
      display: flex;
      justify-content: space-between;
    }

    .muted {
      color: #9aa8bb;
      font-size: 12px;
    }

    .search {
      width: 100%;
      margin: 10px 0 8px;
      padding: 10px 12px;
      border-radius: 13px;
      border: 1px solid #29405f;
      background: #0f1a2c;
      color: #fff;
      font-size: 15px;
    }

    .bar {
      display: flex;
      gap: 7px;
      margin-bottom: 8px;
    }

    .pill {
      flex: 1;
      padding: 8px 4px;
      border: 1px solid #29405f;
      border-radius: 999px;
      background: #0f1a2c;
      color: #fff;
      font-weight: 800;
    }

    .pill.on {
      background: #2f80ed;
    }

    .peoplebar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-bottom: 8px;
    }

    .info {
      font-size: 12px;
      color: #9aa8bb;
      margin: 6px 4px 10px;
    }

    .day {
      border: 1px solid #29405f;
      border-radius: 15px;
      overflow: hidden;
      background: #0f1a2c;
      margin-bottom: 10px;
    }

    .dayhead {
      display: flex;
      justify-content: space-between;
      background: #19385f;
      padding: 8px 10px;
      font-size: 16px;
      font-weight: 900;
    }

    .job {
      display: grid;
      grid-template-columns: 60px minmax(0, 1fr) auto;
      gap: 9px;
      align-items: center;
      padding: 9px;
      border-top: 1px solid #29405f;
    }

    .time {
      text-align: center;
      font-size: 17px;
      font-weight: 900;
    }

    .customer {
      font-size: 16px;
      font-weight: 900;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tag {
      display: inline-block;
      margin-top: 4px;
      padding: 4px 7px;
      border-radius: 8px;
      background: #17375f;
      font-size: 12px;
      font-weight: 800;
    }

    .tag.red {
      background: #512529;
      color: #ff9c9c;
    }

    .tag.yellow {
      background: #5c5000;
      color: #ffe76c;
    }

    .note {
      font-size: 12px;
      color: #9aa8bb;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .people {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      justify-content: flex-end;
      max-width: 116px;
    }

    .person {
      min-width: 49px;
      padding: 7px 8px;
      border-radius: 9px;
      text-align: center;
      background: #1c65ba;
      font-size: 13px;
      font-weight: 900;
    }

    .person:nth-child(2) {
      background: #8a6327;
    }

    .state {
      padding: 24px;
      text-align: center;
      color: #9aa8bb;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="top">

    <div>
      <h1 style="margin:0; font-size:23px;">
        北市勤務排程
      </h1>

      <div class="muted">
        B 全覽模式
      </div>
    </div>

    <div
      class="muted"
      id="today">
    </div>

  </div>

  <input
    id="search"
    class="search"
    placeholder="搜尋客戶、工作、人員、備註…"
  >

  <div class="bar">

    <button
      class="pill on"
      data-view="all">
      全部
    </button>

    <button
      class="pill"
      data-view="today">
      今天
    </button>

    <button
      class="pill"
      data-view="week">
      7天內
    </button>

    <button
      class="pill"
      data-view="future">
      後續
    </button>

  </div>

  <div class="peoplebar">

    <button
      class="pill on"
      data-person="">
      全部人員
    </button>

    <button
      class="pill"
      data-person="文豪">
      文豪
    </button>

    <button
      class="pill"
      data-person="耀文">
      耀文
    </button>

    <button
      class="pill"
      data-person="保鈞">
      保鈞
    </button>

    <button
      class="pill"
      data-person="恆諄">
      恆諄
    </button>

    <button
      class="pill"
      data-person="財哥">
      財哥
    </button>

  </div>

  <div
    class="info"
    id="info">
    讀取資料中…
  </div>

  <div id="list">

    <div class="state">
      正在從 Google Sheet 讀取…
    </div>

  </div>

</div>


<script src="config.js"></script>

<script>

let DATA = [];

let currentView = "all";
let currentPerson = "";

const W = [
  "日",
  "一",
  "二",
  "三",
  "四",
  "五",
  "六"
];

const T = new Date();

T.setHours(
  0,
  0,
  0,
  0
);


// ==============================
// 今天日期
// ==============================

today.textContent =
  `${T.getFullYear()}/` +
  `${T.getMonth() + 1}/` +
  `${T.getDate()}` +
  `（${W[T.getDay()]}）`;


// ==============================
// 日期解析
// ==============================

function pd(s) {

  const m = String(s || "").match(
    /(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/
  );

  if (!m) {
    return null;
  }

  const d = new Date(
    +m[1],
    +m[2] - 1,
    +m[3]
  );

  d.setHours(
    0,
    0,
    0,
    0
  );

  return d;
}


function dd(s) {

  const d = pd(s);

  return d
    ? Math.round(
        (d - T) / 86400000
      )
    : 99999;
}


// ==============================
// 工作類型顏色
// ==============================

function tc(t) {

  if (t === "短租") {
    return "yellow";
  }

  return /新開|增租|POC/.test(t || "")
    ? "red"
    : "";
}


// ==============================
// 篩選資料
// ==============================

function rows() {

  const q =
    search.value
      .trim()
      .toLowerCase();

  return DATA.filter(x => {

    const n = dd(x.date);

    const viewOK =
      currentView === "all" ||

      (
        currentView === "today" &&
        n === 0
      ) ||

      (
        currentView === "week" &&
        n >= 0 &&
        n <= 7
      ) ||

      (
        currentView === "future" &&
        n > 7
      );

    const personOK =
      !currentPerson ||
      (x.people || []).includes(
        currentPerson
      );

    const text = [
      x.date,
      x.time,
      x.customer,
      x.task,
      (x.people || []).join(" "),
      x.note
    ]
      .join(" ")
      .toLowerCase();

    return (
      viewOK &&
      personOK &&
      (
        !q ||
        text.includes(q)
      )
    );

  });
}


// ==============================
// 畫面顯示
// ==============================

function render() {

  const r = rows();

  const groups = {};

  /*
   * 重要：
   * DATA 本身就是 Google Sheet 的列順序。
   *
   * 這裡依序建立日期群組，
   * 不再另外進行日期排序。
   *
   * 所以網頁顯示順序會跟 Sheet 一致。
   */
  r.forEach(x => {

    const key =
      x.date || "未定日期";

    if (!groups[key]) {
      groups[key] = [];
    }

    groups[key].push(x);

  });


  info.textContent =
    `目前顯示 ${r.length} 筆`;


  const groupKeys =
    Object.keys(groups);


  list.innerHTML =
    groupKeys
      .map(k => {

        const d = pd(k);
        const jobs = groups[k];

        const weekday =
          d
            ? `（${W[d.getDay()]}）`
            : "";

        const jobHTML =
          jobs
            .map(x => {

              const peopleHTML =
                (x.people || [])
                  .map(p =>
                    `<span class="person">${p}</span>`
                  )
                  .join("");


              const noteHTML =
                x.note
                  ? `<div class="note">${x.note}</div>`
                  : "";


              return `
                <div class="job">

                  <div class="time">
                    ${x.time || "未定"}
                  </div>

                  <div>

                    <div class="customer">
                      ${x.customer || ""}
                    </div>

                    <span class="tag ${tc(x.task)}">
                      ${x.task || ""}
                    </span>

                    ${noteHTML}

                  </div>

                  <div class="people">
                    ${peopleHTML}
                  </div>

                </div>
              `;

            })
            .join("");


        return `
          <section class="day">

            <div class="dayhead">

              <span>
                ${k}${weekday}
              </span>

              <span>
                ${jobs.length} 筆
              </span>

            </div>

            ${jobHTML}

          </section>
        `;

      })
      .join("")
      ||

      `
        <div class="state">
          沒有符合條件的勤務
        </div>
      `;

}


// ==============================
// 從 Google Sheet API 讀資料
// ==============================

async function load() {

  if (!window.SCHEDULE_API_URL) {

    info.textContent =
      "尚未設定 API";

    list.innerHTML =
      `
        <div class="state">
          請先在 config.js 貼上 Apps Script 網址
        </div>
      `;

    return;
  }


  try {

    const response =
      await fetch(
        window.SCHEDULE_API_URL +
        "?action=list&t=" +
        Date.now(),
        {
          cache: "no-store"
        }
      );


    const json =
      await response.json();


    if (!json.ok) {

      throw Error(
        json.error ||
        "讀取失敗"
      );

    }


    DATA =
      json.data || [];


    render();


  } catch (e) {

    info.textContent =
      "資料讀取失敗";

    list.innerHTML =
      `
        <div class="state">
          ${e.message}
        </div>
      `;

  }

}


// ==============================
// 上方日期篩選按鈕
// ==============================

document
  .querySelectorAll("[data-view]")
  .forEach(button => {

    button.onclick = () => {

      document
        .querySelectorAll("[data-view]")
        .forEach(x =>
          x.classList.remove("on")
        );


      button
        .classList
        .add("on");


      currentView =
        button.dataset.view;


      render();

    };

  });


// ==============================
// 人員篩選按鈕
// ==============================

document
  .querySelectorAll("[data-person]")
  .forEach(button => {

    button.onclick = () => {

      document
        .querySelectorAll("[data-person]")
        .forEach(x =>
          x.classList.remove("on")
        );


      button
        .classList
        .add("on");


      currentPerson =
        button.dataset.person;


      render();

    };

  });


// ==============================
// 搜尋
// ==============================

search.oninput =
  render;


// ==============================
// 啟動
// ==============================

load();


// 每 60 秒重新讀取 Google Sheet
setInterval(
  load,
  60000
);

</script>

</body>
</html>
