<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08111f"><link rel="manifest" href="manifest.webmanifest"><title>北市勤務排程</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08111f;color:#f7f9fc;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}.app{max-width:560px;margin:auto;padding:18px 10px 90px}.top{display:flex;justify-content:space-between;align-items:start}.top h1{font-size:23px;margin:0}.muted{color:#9daabd;font-size:12px}.right{text-align:right}.search{width:100%;margin:10px 0 8px;padding:10px 12px;border-radius:13px;border:1px solid #29405f;background:#0f1a2c;color:white;font-size:15px}.bar{display:flex;gap:7px;margin-bottom:8px}.pill{flex:1;padding:8px 4px;border:1px solid #29405f;border-radius:999px;background:#0f1a2c;color:white;font-weight:800;font-size:13px}.pill.on{background:#2f80ed}.peoplebar{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:8px}.info{font-size:12px;color:#9daabd;margin:4px 4px 10px}.day{border:1px solid #29405f;border-radius:15px;overflow:hidden;background:#0f1a2c;margin-bottom:10px}.dayhead{display:flex;justify-content:space-between;background:#19385f;padding:8px 10px;font-size:16px;font-weight:900}.job{display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:9px;align-items:center;padding:9px;border-top:1px solid #29405f}.dayhead+.job{border-top:0}.time{text-align:center;font-size:17px;font-weight:900}.customer{font-size:16px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tag{display:inline-block;margin-top:4px;padding:4px 7px;border-radius:8px;background:#17375f;font-size:12px;font-weight:800}.tag.red{background:#512529;color:#ff9c9c}.tag.yellow{background:#5c5000;color:#ffe76c}.note{font-size:12px;color:#9daabd;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.people{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:116px}.person{min-width:49px;padding:7px 8px;border-radius:9px;text-align:center;background:#1c65ba;font-size:13px;font-weight:900}.person:nth-child(2){background:#8a6327}.add{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 18px);border:0;border-radius:999px;padding:13px 18px;background:#2f80ed;color:white;font-size:16px;font-weight:900;box-shadow:0 8px 25px #0008}.back{display:none;position:fixed;inset:0;background:#000a;z-index:10}.back.open{display:block}.sheet{position:absolute;bottom:0;left:0;right:0;background:#101c2e;border-radius:22px 22px 0 0;padding:16px 14px calc(env(safe-area-inset-bottom) + 18px);max-height:90vh;overflow:auto}.sheethead{display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:900;margin-bottom:12px}.close{border:0;background:#263b59;color:white;width:34px;height:34px;border-radius:50%;font-size:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{margin-bottom:4px}.full{grid-column:1/-1}.field label{display:block;color:#9daabd;font-size:12px;margin:0 0 5px 3px}.field input,.field textarea{width:100%;padding:11px;border:1px solid #29405f;border-radius:11px;background:#091422;color:white;font-size:16px}.field textarea{height:78px}.checks{display:flex;flex-wrap:wrap;gap:7px}.checks label{color:white;background:#172842;padding:9px;border:1px solid #29405f;border-radius:9px;font-weight:800}.save{width:100%;margin-top:10px;padding:12px;border:0;border-radius:11px;background:#2f80ed;color:white;font-size:16px;font-weight:900}
</style></head><body><div class="app"><div class="top"><div><h1>北市勤務排程</h1><div class="muted">B 全覽模式</div></div><div class="muted right">2026/9/11（五）<br>共 18 筆</div></div><input id="search" class="search" placeholder="搜尋客戶、工作、人員、備註…"><div class="bar"><button class="pill on" data-view="all">全部</button><button class="pill" data-view="today">今天</button><button class="pill" data-view="week">7天內</button><button class="pill" data-view="future">後續</button></div><div class="peoplebar"><button class="pill on" data-person="">全部人員</button><button class="pill" data-person="文豪">文豪</button><button class="pill" data-person="耀文">耀文</button><button class="pill" data-person="保鈞">保鈞</button><button class="pill" data-person="恆諄">恆諄</button><button class="pill" data-person="財哥">財哥</button></div><div class="info" id="info">目前顯示 18 筆　·　最近勤務 9/10 15:00</div><div id="list"></div></div><button class="add" id="add">＋ 新增勤務</button>
<div class="back" id="back"><div class="sheet"><div class="sheethead">新增勤務 <button class="close" id="close">×</button></div><div class="grid"><div class="field"><label>日期</label><input type="date"></div><div class="field"><label>時間</label><input type="time"></div><div class="field full"><label>客戶</label><input placeholder="客戶／門市"></div><div class="field full"><label>工作內容</label><input placeholder="工作內容"></div><div class="field full"><label>工程師</label><div class="checks"><label><input type="checkbox"> 文豪</label><label><input type="checkbox"> 耀文</label><label><input type="checkbox"> 保鈞</label><label><input type="checkbox"> 恆諄</label><label><input type="checkbox"> 財哥</label></div></div><div class="field full"><label>備註</label><textarea placeholder="地址、設備、注意事項…"></textarea></div></div><button class="save" onclick="alert('目前先測試新增介面，尚未寫入 Google Sheet')">新增至排程</button></div></div>
<script>
const data=[["2026/9/10","四","15:00","4383 南港園區店","重裝撤店",["文豪","耀文"],"台北市南港區重陽路472號一樓"],["2026/9/11","五","15:00","2397 內湖中時店","閉店撤店",["保鈞","耀文"],"台北市內湖區民權東路六段58號"],["2026/9/14","一","11:00","2707 大同哈密店","重裝新開",["保鈞","恆諄"],""],["2026/9/16","三","15:00","B156 松山敦化公園","重裝撤店",["文豪","恆諄"],""],["2026/9/16","三","下午","5426 大安忠孝東","TM掃槍POC",["恆諄"],"TM 一機 Zebra DS2208 + TM 二機 AIDA 914"],["2026/9/16","三","15:00","3597 萬華雙園店","重裝撤店",["保鈞"],""],["2026/9/17","四","11:00","2707 大同哈密店","重裝新開",["保鈞","恆諄"],""],["2026/9/17","四","14:00","增鴻科技","換機",["耀文","文豪"],"現場裝機 *帶四支滾筒備用"],["2026/9/18","五","14:00","癌醫","增租",["恆諄","保鈞"],"健康管理中心 3525AC*2"],["2026/9/18","五","未定","台大泌尿科3525AC","短租",["財哥"],"9/18-9/21 張榮發基金會"],["2026/9/21","一","15:00","2006 內湖金湖店","閉店撤店",["耀文","文豪"],""],["2026/9/29","二","未定","台哥大電信21樓","增租",[],"TES3028A 4工2屜"],["2026/9/29","二","15:00","4159 萬華廣州店","閉店撤店",["保鈞","恆諄"],""],["2026/10/6","二","10:00","自來水工會","增租",["文豪"],"懷寧街"],["2026/10/6","二","11:00","5511 大同大龍峒","新開門市",["保鈞"],"MMK設置在門市，其餘設備在三重倉"],["2026/10/15","四","11:00","4383 南港園區店","重裝新開",[],""],["2026/10/28","三","11:00","B156 松山敦化公園","重裝新開",[],""],["未定日期","","未定","台哥大文創","設定",["文豪","保鈞"],"更改IP/PaperCut/Server Driver Port"]];
let currentView="all",currentPerson="";
const BASE=new Date(2026,8,11);
function toDate(s){if(!s||s==="未定日期")return null;const p=s.split("/").map(Number);return new Date(p[0],p[1]-1,p[2])}
function daysFromBase(s){const d=toDate(s);return d?Math.round((d-BASE)/86400000):9999}
function filtered(){
 const q=(document.getElementById("search").value||"").trim().toLowerCase();
 return data.filter(x=>{
  const dd=daysFromBase(x[0]);
  const viewOK=currentView==="all"||(currentView==="today"&&dd===0)||(currentView==="week"&&dd>=0&&dd<=7)||(currentView==="future"&&dd>7);
  const personOK=!currentPerson||x[5].includes(currentPerson);
  const text=x.join(" ").toLowerCase();
  return viewOK&&personOK&&(!q||text.includes(q));
 });
}
function render(){
 const rows=filtered(),groups={};
 rows.forEach(x=>(groups[x[0]]??=[]).push(x));
 document.getElementById("info").textContent=`目前顯示 ${rows.length} 筆`;
 document.getElementById("list").innerHTML=Object.entries(groups).map(([d,a])=>`<section class="day"><div class="dayhead"><span>${d}${a[0][1]?`（${a[0][1]}）`:""}</span><span>${a.length} 筆</span></div>${a.map(x=>`<div class="job"><div class="time">${x[2]}</div><div><div class="customer">${x[3]}</div><span class="tag ${x[4]=="短租"?"yellow":(/新開|增租|POC/.test(x[4])?"red":"")}">${x[4]}</span>${x[6]?`<div class="note">${x[6]}</div>`:""}</div><div class="people">${x[5].map(p=>`<span class="person">${p}</span>`).join("")}</div></div>`).join("")}</section>`).join("")||'<div class="muted" style="padding:20px;text-align:center">沒有符合條件的勤務</div>';
}
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{
 document.querySelectorAll("[data-view]").forEach(x=>x.classList.remove("on"));b.classList.add("on");currentView=b.dataset.view;render();
});
document.querySelectorAll("[data-person]").forEach(b=>b.onclick=()=>{
 document.querySelectorAll("[data-person]").forEach(x=>x.classList.remove("on"));b.classList.add("on");currentPerson=b.dataset.person;render();
});
document.getElementById("search").addEventListener("input",render);
render();
const back=document.getElementById("back");document.getElementById("add").onclick=()=>back.classList.add("open");document.getElementById("close").onclick=()=>back.classList.remove("open");back.onclick=e=>{if(e.target===back)back.classList.remove("open")};
if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js");
</script></body></html>
