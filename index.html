<!doctype html>

<html lang="zh-Hant">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#08111f"
  >

  <link
    rel="manifest"
    href="manifest.webmanifest"
  >

  <title>
    北市勤務排程
  </title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;
      padding: 0;

      background: #08111f;
      color: #fff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;
    }


    body {
      min-height: 100vh;
    }


    .app {

      max-width: 560px;

      margin: 0 auto;

      padding-left: 10px;
      padding-right: 10px;

      padding-bottom:
        calc(
          18px +
          env(safe-area-inset-bottom)
        );

      /*
       * iPhone 狀態列 / 動態島避讓
       */
      padding-top:
        calc(
          env(safe-area-inset-top) +
          10px
        );
    }


    .top {

      display: flex;

      justify-content: space-between;

      align-items: flex-start;

      gap: 10px;
    }


    .title {

      margin: 0;

      font-size: 23px;

      line-height: 1.2;

      font-weight: 900;
    }


    .muted {

      color: #9aa8bb;

      font-size: 12px;
    }


    #today {

      white-space: nowrap;

      padding-top: 2px;
    }


    .search {

      width: 100%;

      margin: 12px 0 8px;

      padding: 11px 12px;

      border-radius: 13px;

      border:
        1px solid #29405f;

      background: #0f1a2c;

      color: #fff;

      font-size: 15px;

      outline: none;
    }


    .search::placeholder {
      color: #75869c;
    }


    .bar {

      display: flex;

      gap: 7px;

      margin-bottom: 8px;
    }


    .pill {

      flex: 1;

      padding: 9px 4px;

      border:
        1px solid #29405f;

      border-radius: 999px;

      background: #0f1a2c;

      color: #fff;

      font-size: 14px;

      font-weight: 800;

      cursor: pointer;
    }


    .pill.on {

      background: #2f80ed;

      border-color: #2f80ed;
    }


    .peoplebar {

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 7px;

      margin-bottom: 8px;
    }


    .info {

      font-size: 12px;

      color: #9aa8bb;

      margin:
        7px
        4px
        10px;
    }


    .day {

      border:
        1px solid #29405f;

      border-radius: 15px;

      overflow: hidden;

      background: #0f1a2c;

      margin-bottom: 10px;
    }


    .dayhead {

      display: flex;

      justify-content: space-between;

      align-items: center;

      background: #19385f;

      padding: 9px 11px;

      font-size: 16px;

      font-weight: 900;
    }


    /*
     * 每一筆勤務
     */

    .job {

      display: grid;

      grid-template-columns:
        60px
        minmax(0, 1fr)
        auto;

      gap: 9px;

      align-items: center;

      padding: 10px 9px;

      border-top:
        1px solid #29405f;

      cursor: pointer;

      -webkit-tap-highlight-color:
        transparent;
    }


    .job:hover {
      background: #111f33;
    }


    .job.open {
      background: #111f33;
    }


    .time {

      text-align: center;

      font-size: 17px;

      font-weight: 900;

      line-height: 1.2;
    }


    .customer {

      font-size: 16px;

      font-weight: 900;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }


    .tag {

      display: inline-block;

      margin-top: 4px;

      padding: 4px 7px;

      border-radius: 8px;

      background: #17375f;

      font-size: 12px;

      font-weight: 800;
    }


    .tag.red {

      background: #512529;

      color: #ff9c9c;
    }


    .tag.yellow {

      background: #5c5000;

      color: #ffe76c;
    }


    .people {

      display: flex;

      gap: 5px;

      flex-wrap: wrap;

      justify-content: flex-end;

      max-width: 116px;
    }


    .person {

      min-width: 49px;

      padding: 7px 8px;

      border-radius: 9px;

      text-align: center;

      background: #1c65ba;

      font-size: 13px;

      font-weight: 900;
    }


    .person:nth-child(2) {
      background: #8a6327;
    }


    /*
     * 備註展開區
     *
     * 預設完全隱藏
     */

    .details {

      display: none;

      grid-column:
        1 / -1;

      margin-top: 3px;

      padding:
        10px
        11px
        3px;

      border-top:
        1px dashed #36506f;

      color: #c1cede;
    }


    /*
     * 點勤務後展開
     */

    .job.open .details {
      display: block;
    }


    .detail-row {

      display: grid;

      grid-template-columns:
        54px
        minmax(0, 1fr);

      gap: 7px;

      margin-bottom: 8px;

      font-size: 13px;

      line-height: 1.55;
    }


    .detail-label {

      color: #6faeff;

      font-weight: 900;
    }


    .detail-text {

      color: #c5d2e3;

      white-space: normal;

      overflow-wrap: anywhere;

      word-break: break-word;
    }


    /*
     * 有備註時顯示小提示
     */

    .detail-hint {

      display: inline-block;

      margin-left: 6px;

      color: #7ea3cf;

      font-size: 11px;

      font-weight: 500;

      vertical-align: middle;
    }


    .job.open .detail-hint {
      color: #8ebfff;
    }


    .state {

      padding: 24px;

      text-align: center;

      color: #9aa8bb;
    }


    @media (max-width: 380px) {

      .app {

        padding-left: 8px;

        padding-right: 8px;
      }


      .job {

        grid-template-columns:
          52px
          minmax(0, 1fr)
          auto;

        gap: 7px;
      }


      .time {
        font-size: 16px;
      }


      .customer {
        font-size: 15px;
      }


      .person {

        min-width: 45px;

        padding: 7px 6px;
      }

    }

  </style>

</head>


<body>


<div class="app">


  <div class="top">


    <div>

      <h1 class="title">
        北市勤務排程
      </h1>

      <div class="muted">
        B 全覽模式
      </div>

    </div>


    <div
      class="muted"
      id="today">
    </div>


  </div>


  <input
    id="search"
    class="search"
    placeholder="搜尋客戶、工作、人員、備註…"
  >


  <div class="bar">

    <button
      class="pill on"
      data-view="all">
      全部
    </button>

    <button
      class="pill"
      data-view="today">
      今天
    </button>

    <button
      class="pill"
      data-view="week">
      7天內
    </button>

    <button
      class="pill"
      data-view="future">
      後續
    </button>

  </div>


  <div class="peoplebar">

    <button
      class="pill on"
      data-person="">
      全部人員
    </button>

    <button
      class="pill"
      data-person="文豪">
      文豪
    </button>

    <button
      class="pill"
      data-person="耀文">
      耀文
    </button>

    <button
      class="pill"
      data-person="保鈞">
      保鈞
    </button>

    <button
      class="pill"
      data-person="恆諄">
      恆諄
    </button>

    <button
      class="pill"
      data-person="財哥">
      財哥
    </button>

  </div>


  <div
    class="info"
    id="info">

    讀取資料中…

  </div>


  <div id="list">

    <div class="state">

      正在從 Google Sheet 讀取…

    </div>

  </div>


</div>


<script src="config.js"></script>


<script>

const CACHE_KEY = "schedule-cache-v1";

let DATA = [];

try {
  const cached = localStorage.getItem(CACHE_KEY);

  if (cached) {
    DATA = JSON.parse(cached);
  }
} catch (e) {
  DATA = [];
}

let currentView = "all";

let currentPerson = "";


const W = [
  "日",
  "一",
  "二",
  "三",
  "四",
  "五",
  "六"
];


const T =
  new Date();


T.setHours(
  0,
  0,
  0,
  0
);


/*
 * 今天日期
 */

today.textContent =
  `${T.getFullYear()}/` +
  `${T.getMonth() + 1}/` +
  `${T.getDate()}` +
  `（${W[T.getDay()]}）`;



/*
 * 日期解析
 */

function pd(s) {

  const m =
    String(s || "")
      .match(
        /(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/
      );


  if (!m) {
    return null;
  }


  const d =
    new Date(
      +m[1],
      +m[2] - 1,
      +m[3]
    );


  d.setHours(
    0,
    0,
    0,
    0
  );


  return d;
}



function dd(s) {

  const d =
    pd(s);


  return d
    ? Math.round(
        (d - T) /
        86400000
      )
    : 99999;
}



/*
 * 工作標籤顏色
 */

function tc(t) {

  if (t === "短租") {
    return "yellow";
  }


  return /新開|增租|POC/.test(
    t || ""
  )
    ? "red"
    : "";
}



/*
 * HTML 特殊字元處理
 */

function esc(value) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}



/*
 * 篩選
 */

function rows() {

  const q =
    search.value
      .trim()
      .toLowerCase();


  return DATA.filter(x => {

    const n =
      dd(x.date);


    const viewOK =

      currentView === "all"

      ||

      (
        currentView === "today" &&
        n === 0
      )

      ||

      (
        currentView === "week" &&
        n >= 0 &&
        n <= 7
      )

      ||

      (
        currentView === "future" &&
        n > 7
      );


    const personOK =

      !currentPerson

      ||

      (x.people || [])
        .includes(
          currentPerson
        );


    /*
     * 搜尋也包含備註1、2、3
     */

    const text = [

      x.date,

      x.time,

      x.customer,

      x.task,

      (x.people || [])
        .join(" "),

      x.note1 || x.note,

      x.note2,

      x.note3

    ]
      .join(" ")
      .toLowerCase();


    return (

      viewOK

      &&

      personOK

      &&

      (
        !q ||
        text.includes(q)
      )

    );

  });

}



/*
 * 畫面顯示
 */

function render() {

  const r =
    rows();


  const groups = {};


  /*
   * 完全照 Sheet 原始列順序
   */

  r.forEach(x => {

    const key =
      x.date ||
      "未定日期";


    if (!groups[key]) {
      groups[key] = [];
    }


    groups[key].push(x);

  });


  info.textContent =
    `目前顯示 ${r.length} 筆`;


  const groupKeys =
    Object.keys(groups);



  list.innerHTML =

    groupKeys
      .map(k => {


        const d =
          pd(k);


        const jobs =
          groups[k];


        const weekday =
          d
            ? `（${W[d.getDay()]}）`
            : "";



        const jobHTML =

          jobs
            .map(x => {


              const peopleHTML =

                (x.people || [])
                  .map(
                    p =>
                      `<span class="person">${esc(p)}</span>`
                  )
                  .join("");



              const note1 =
                x.note1 ||
                x.note ||
                "";


              const note2 =
                x.note2 ||
                "";


              const note3 =
                x.note3 ||
                "";


              const hasDetails =
                note1 ||
                note2 ||
                note3;



              const hintHTML =
                hasDetails
                  ? `<span class="detail-hint">點擊查看備註</span>`
                  : "";



              let detailsHTML =
                "";


              if (hasDetails) {

                detailsHTML =
                  `<div class="details">`;


                if (note1) {

                  detailsHTML += `
                    <div class="detail-row">

                      <div class="detail-label">
                        備註
                      </div>

                      <div class="detail-text">
                        ${esc(note1)}
                      </div>

                    </div>
                  `;
                }


                if (note2) {

                  detailsHTML += `
                    <div class="detail-row">

                      <div class="detail-label">
                        備註2
                      </div>

                      <div class="detail-text">
                        ${esc(note2)}
                      </div>

                    </div>
                  `;
                }


                if (note3) {

                  detailsHTML += `
                    <div class="detail-row">

                      <div class="detail-label">
                        備註3
                      </div>

                      <div class="detail-text">
                        ${esc(note3)}
                      </div>

                    </div>
                  `;
                }


                detailsHTML +=
                  `</div>`;
              }



              return `

                <div
                  class="job"
                  onclick="toggleJob(this)"
                >


                  <div class="time">

                    ${esc(
                      x.time ||
                      "未定"
                    )}

                  </div>


                  <div>


                    <div class="customer">

                      ${esc(
                        x.customer ||
                        ""
                      )}

                    </div>


                    <span
                      class="tag ${tc(x.task)}"
                    >

                      ${esc(
                        x.task ||
                        ""
                      )}

                    </span>


                    ${hintHTML}


                  </div>


                  <div class="people">

                    ${peopleHTML}

                  </div>


                  ${detailsHTML}


                </div>

              `;

            })
            .join("");



        return `

          <section class="day">


            <div class="dayhead">


              <span>

                ${esc(k)}${weekday}

              </span>


              <span>

                ${jobs.length} 筆

              </span>


            </div>


            ${jobHTML}


          </section>

        `;

      })
      .join("")

    ||

    `

      <div class="state">

        沒有符合條件的勤務

      </div>

    `;

}



/*
 * 點勤務展開 / 收起
 */

function toggleJob(element) {

  /*
   * 沒有備註就不需要展開
   */

  if (
    !element.querySelector(
      ".details"
    )
  ) {
    return;
  }


  element
    .classList
    .toggle(
      "open"
    );

}



/*
 * API
 */

async function load() {

  if (
    !window.SCHEDULE_API_URL
  ) {

    info.textContent =
      "尚未設定 API";


    list.innerHTML =
      `

        <div class="state">

          請先在 config.js 貼上 Apps Script 網址

        </div>

      `;


    return;
  }


  try {


    const response =

      await fetch(

        window.SCHEDULE_API_URL

        +

        "?action=list&t="

        +

        Date.now(),

        {
          cache: "no-store"
        }

      );



    const json =
      await response.json();



    if (!json.ok) {

      throw Error(
        json.error ||
        "讀取失敗"
      );

    }



    DATA = json.data || [];

    try {
      localStorage.setItem(
        CACHE_KEY,
        JSON.stringify(DATA)
      );
    } catch (e) {
    }

    render();


  } catch (e) {


    info.textContent =
      "資料讀取失敗";


    list.innerHTML =
      `

        <div class="state">

          ${esc(e.message)}

        </div>

      `;

  }

}



/*
 * 日期篩選
 */

document
  .querySelectorAll(
    "[data-view]"
  )
  .forEach(
    button => {

      button.onclick =
        () => {


          document
            .querySelectorAll(
              "[data-view]"
            )
            .forEach(
              x =>
                x.classList.remove(
                  "on"
                )
            );


          button
            .classList
            .add(
              "on"
            );


          currentView =
            button.dataset.view;


          render();

        };

    }
  );



/*
 * 人員篩選
 */

document
  .querySelectorAll(
    "[data-person]"
  )
  .forEach(
    button => {

      button.onclick =
        () => {


          document
            .querySelectorAll(
              "[data-person]"
            )
            .forEach(
              x =>
                x.classList.remove(
                  "on"
                )
            );


          button
            .classList
            .add(
              "on"
            );


          currentPerson =
            button.dataset.person;


          render();

        };

    }
  );



/*
 * 搜尋
 */

search.oninput =
  render;



/*
 * 啟動
 */

// 有上次資料，先立即顯示
if (DATA.length > 0) {
  render();
  info.textContent =
    `目前顯示 ${DATA.length} 筆・同步中…`;
}

// 背景抓最新 Google Sheet
load();

// 每 60 秒重新同步
setInterval(
  load,
  60000
);

</script>


</body>

</html>
