<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>北市勤務排程｜管理</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1320;color:#eef3f9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}.wrap{max-width:1180px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;align-items:center}.layout{display:grid;grid-template-columns:420px 1fr;gap:18px;margin-top:18px}.panel{background:#111e31;border:1px solid #2b405f;border-radius:16px;padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.field{margin-bottom:8px}.field label{display:block;font-size:13px;color:#9eabc0;margin-bottom:5px}input,textarea{width:100%;background:#0a1423;color:#fff;border:1px solid #2b405f;border-radius:10px;padding:11px;font-size:15px}textarea{min-height:90px}.people{display:flex;gap:8px;flex-wrap:wrap}.pc{background:#172943;border:1px solid #2b405f;border-radius:9px;padding:9px 11px;font-weight:800}.save{width:100%;border:0;border-radius:11px;background:#2f80ed;color:#fff;padding:12px;font-size:16px;font-weight:900}.list{max-height:72vh;overflow:auto}.row{display:grid;grid-template-columns:92px 70px 1fr 110px 170px;gap:8px;padding:10px 6px;border-bottom:1px solid #243650}.muted{color:#9eabc0;font-size:12px}@media(max-width:850px){.layout{grid-template-columns:1fr}.row{grid-template-columns:80px 60px 1fr}.row>:nth-child(4),.row>:nth-child(5){grid-column:3}}
</style></head><body><div class="wrap"><div class="head"><h1>北市勤務排程｜管理</h1><a href="./" style="color:#7db1ff">← 回全覽</a></div><div class="layout"><section class="panel"><h2>新增勤務</h2><form id="f"><div class="grid"><div class="field"><label>日期</label><input id="date" type="date" required></div><div class="field"><label>時間</label><input id="time" type="time"></div><div class="field full"><label>客戶</label><input id="customer" required></div><div class="field full"><label>工作內容</label><input id="task" required></div><div class="field full"><label>工程師</label><div class="people"><label class="pc"><input type="checkbox" name="people" value="文豪"> 文豪</label><label class="pc"><input type="checkbox" name="people" value="耀文"> 耀文</label><label class="pc"><input type="checkbox" name="people" value="保鈞"> 保鈞</label><label class="pc"><input type="checkbox" name="people" value="恆諄"> 恆諄</label><label class="pc"><input type="checkbox" name="people" value="財哥"> 財哥</label></div></div><div class="field full"><label>備註</label><textarea id="note"></textarea></div></div><button class="save">新增至 Google Sheet</button><div class="muted" id="st"></div></form></section><section class="panel"><h2>近期排程</h2><div class="list" id="list">讀取中…</div></section></div></div><script src="config.js"></script><script>
async function getList(){let r=await fetch(window.SCHEDULE_API_URL+"?action=list&t="+Date.now(),{cache:"no-store"});return r.json()}async function load(){try{let j=await getList();if(!j.ok)throw Error(j.error);list.innerHTML=(j.data||[]).map(x=>`<div class="row"><div>${x.date||""}</div><div>${x.time||""}</div><div><b>${x.customer||""}</b><div class="muted">${x.note||""}</div></div><div>${x.task||""}</div><div>${(x.people||[]).join(" / ")}</div></div>`).join("")}catch(e){list.textContent=e.message}}
f.onsubmit=async e=>{e.preventDefault();st.textContent="寫入中…";try{let body={action:"add",date:date.value,time:time.value,customer:customer.value.trim(),task:task.value.trim(),people:[...document.querySelectorAll('input[name="people"]:checked')].map(x=>x.value),note:note.value.trim()},r=await fetch(window.SCHEDULE_API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)}),j=await r.json();if(!j.ok)throw Error(j.error);st.textContent="已新增";f.reset();load()}catch(e){st.textContent="錯誤："+e.message}};load();
</script></body></html>
